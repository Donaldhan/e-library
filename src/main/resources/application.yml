server:
  port: 8080

spring:
  application:
    name: e-library
  datasource:
    # SQLite is a single-writer database. The pool is intentionally small: it removes
    # "database is locked" upgrade errors while the license invariant itself is still enforced by
    # atomic conditional updates and CHECK constraints. Swap the URL/dialect for PostgreSQL to scale.
    url: jdbc:sqlite:${ELIBRARY_DB_PATH:./data/elibrary.db}?busy_timeout=5000&journal_mode=WAL&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      pool-name: sqlite-pool
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

elibrary:
  reservation:
    hold-duration: PT48H
  seed:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.elibrary: INFO
    org.hibernate.SQL: WARN
